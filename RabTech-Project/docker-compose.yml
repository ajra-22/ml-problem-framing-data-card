services:
  churn-inference-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: churn-inference-api:1.0.0
    container_name: churn-ml-service
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Customer Churn Prediction API
      - APP_VERSION=1.0.0
      - CHURN_THRESHOLD=0.5
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
